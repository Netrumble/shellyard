# Checks every pull request before it is merged: types, tests and the build, on each system
# ShellYard runs on. Nothing is packaged nor published here; that is the Desktop installers
# workflow, after the merge.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older checks pointless.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Types
        run: npm run typecheck

      # On Windows the runner's TEMP is a short 8.3 name (C:\Users\RUNNER~1\...), which git
      # reports back in its long form: tests comparing folders would see two places.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"; fi
          npm test

      - name: Build
        run: npm run build
