# At every push to main: works out the next version, builds the desktop installers (the Windows
# setup program and the macOS disk images, Apple Silicon and Intel) and publishes them as a
# GitHub release.
#
# The version: VERSION_BASE below sets the major and minor, and its patch stays 0. The patch of
# the release is one more than the highest patch already released with that major and minor:
# with v0.2.0 released, the next build is v0.2.1. To start 0.3, set VERSION_BASE to 0.3.0: the
# first build is v0.3.0.
#
# Each installer is built on its own system, because the server's native module (node-pty) is
# installed for the system and processor of the build machine.
name: Desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERSION_BASE: 0.2.0

permissions:
  contents: read

# One run at a time, never cancelled: two runs working out the version together would pick the
# same one, and a run stopped halfway could leave a release without its files.
concurrency:
  group: desktop-installers
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName')
          version=$(printf '%s\n' "$tags" | node .github/scripts/next-version.mjs "$VERSION_BASE")
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.exe)
            os: windows-latest
            artifact: shellyard-windows
            files: |
              desktop/release/*.exe
              desktop/release/*.exe.sha256
          - name: macOS Apple Silicon (.dmg)
            os: macos-latest
            artifact: shellyard-macos-arm64
            files: |
              desktop/release/*.dmg
              desktop/release/*.dmg.sha256
          # The disk image is for the processor of the machine that builds it: Intel Macs get
          # theirs from an Intel runner.
          - name: macOS Intel (.dmg)
            os: macos-15-intel
            artifact: shellyard-macos-x64
            files: |
              desktop/release/*.dmg
              desktop/release/*.dmg.sha256
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # On Windows the runner's TEMP is a short 8.3 name (C:\Users\RUNNER~1\...), which git
      # reports back in its long form: tests comparing folders would see two places.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"; fi
          npm test

      - name: Install the desktop app's tools
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # After the installs: npm ci checks the lockfiles against the manifests as committed.
      - name: Set the version
        shell: bash
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          (cd desktop && npm version "$VERSION" --no-git-tag-version --allow-same-version)

      - name: Build the installer
        working-directory: desktop
        env:
          # The app is ad-hoc signed (see electron-builder.json): no certificate is looked for.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run installer

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  # Only main makes releases: a run started by hand on another branch builds the installers and
  # stops there, its files left as artifacts of the run.
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The notes start with how to install, then GitHub's list of the changes.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l installers
          cat > notes.md <<EOF
          ## Install

          - **Windows**: run \`ShellYard-Setup-$VERSION.exe\`. It is not code-signed yet: if SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**.
          - **macOS**: open \`ShellYard-$VERSION-arm64.dmg\` on Apple Silicon (M1 and later), \`ShellYard-$VERSION-x64.dmg\` on an Intel Mac, and drag ShellYard into Applications.

          > [!IMPORTANT]
          > **macOS refuses to open the app the first time** ("Apple could not verify ShellYard.app is free of malware…"): it is not signed with an Apple Developer ID nor notarised yet. It is not damaged. Allow it once, either in Terminal:
          >
          > \`\`\`
          > xattr -dr com.apple.quarantine /Applications/ShellYard.app
          > \`\`\`
          >
          > or open it, close the warning with **Done**, then **System Settings → Privacy & Security → Open Anyway**.

          Node.js 22 or later must be installed: the server runs on it. Each file has its SHA-256 checksum beside it (\`shasum -a 256 -c <file>.sha256\` on macOS).

          EOF
          gh release create "v$VERSION" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ShellYard $VERSION" \
            --notes-file notes.md \
            --generate-notes
